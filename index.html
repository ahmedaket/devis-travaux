<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon outil de devis</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; color: #222; }
    h1 { color: #2457d6; }
    input { padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; }
    .ligne { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; margin: 10px 0; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; cursor: pointer; }
    .ajouter { background: #2457d6; color: white; }
    .supprimer { background: #eee; }
    .total { text-align: right; font-size: 1.2em; margin-top: 20px; }
    @media (max-width: 600px) { .ligne { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <h1>Créer un devis</h1>
  <label>Nom du client<br><input id="client" placeholder="Nom du client"></label>

  <h2>Prestations</h2>
  <div id="lignes"></div>
  <button class="ajouter" onclick="ajouterLigne()">+ Ajouter une prestation</button>

  <div class="total">
    <p>Total HT : <span id="ht">0,00</span> €</p>
    <p>TVA (21 %) : <span id="tva">0,00</span> €</p>
    <strong>Total TVAC : <span id="ttc">0,00</span> €</strong>
  </div>

  <button class="ajouter" onclick="window.print()">Imprimer / enregistrer en PDF</button>

  <script>
    function ajouterLigne() {
      const ligne = document.createElement("div");
      ligne.className = "ligne";
      ligne.innerHTML = `
        <input placeholder="Description">
        <input type="number" min="0" placeholder="Quantité" value="1" oninput="calculer()">
        <input type="number" min="0" step="0.01" placeholder="Prix unitaire HT (€)" oninput="calculer()">
        <button class="supprimer" onclick="this.parentElement.remove(); calculer()">Supprimer</button>
      `;
      document.getElementById("lignes").appendChild(ligne);
    }

    function calculer() {
      let total = 0;
      document.querySelectorAll(".ligne").forEach(ligne => {
        const quantite = Number(ligne.children[1].value) || 0;
        const prix = Number(ligne.children[2].value) || 0;
        total += quantite * prix;
      });
      document.getElementById("ht").textContent = total.toFixed(2).replace(".", ",");
      document.getElementById("tva").textContent = (total * 0.21).toFixed(2).replace(".", ",");
      document.getElementById("ttc").textContent = (total * 1.21).toFixed(2).replace(".", ",");
    }

    ajouterLigne();
  </script>
</body>
</html>
